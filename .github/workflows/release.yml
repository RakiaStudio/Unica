name: Release

# How releases work:
# 1. Every merged change carries a changeset. On push to main, changesets/action
#    opens (or updates) a "chore(release): version packages" PR with the version
#    bump and CHANGELOG entry.
# 2. Merging that PR runs this workflow again; now there are no pending
#    changesets, so the action publishes to npm with provenance.
#
# Publishing uses npm trusted publishing (OIDC); there is no npm token. The
# package's Trusted Publisher on npmjs.com names this repository and this
# workflow file, and `id-token: write` lets npm exchange the job's OIDC token
# for a short-lived publish credential. Renaming this file breaks publishing
# until the Trusted Publisher is updated to match.
#
# Two repository settings are required, both documented in CONTRIBUTING.md:
# - Settings > Actions > General > Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests" must be ON,
#   otherwise step 1 fails with "GitHub Actions is not permitted to create or
#   approve pull requests".
# - PRs opened with GITHUB_TOKEN do not trigger other workflows, so the release
#   PR shows no CI checks. Branch protection must therefore let administrators
#   bypass the required checks (do not enable "Include administrators"), or the
#   release PR cannot be merged. This is safe: `npm run release` runs
#   `prepublishOnly`, which executes the full `npm run check` before publishing.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing and provenance

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm CLI 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
