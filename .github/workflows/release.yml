name: Release

# How releases work:
# 1. Every merged change carries a changeset. On push to main, changesets/action
#    opens (or updates) a "chore(release): version packages" PR with the version
#    bump and CHANGELOG entry.
# 2. Merging that PR runs this workflow again; now there are no pending
#    changesets, so the action publishes to npm with provenance.
#
# Publishing uses npm trusted publishing (OIDC); there is no npm token. The
# package's Trusted Publisher on npmjs.com names this repository and this
# workflow file, and `id-token: write` lets npm exchange the job's OIDC token
# for a short-lived publish credential. Renaming this file breaks publishing
# until the Trusted Publisher is updated to match.
#
# Two repository settings are required, both documented in CONTRIBUTING.md:
# - Settings > Actions > General > Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests" must be ON,
#   otherwise step 1 fails with "GitHub Actions is not permitted to create or
#   approve pull requests".
# - PRs opened with GITHUB_TOKEN do not trigger other workflows, so the release
#   PR shows no CI checks. Branch protection must therefore let administrators
#   bypass the required checks (do not enable "Include administrators"), or the
#   release PR cannot be merged. This is safe: `npm run release` runs
#   `prepublishOnly`, which executes the full `npm run check` before publishing.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing and provenance

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in the job that can publish: a cache written by
          # another workflow run must not be able to change what gets built.
          package-manager-cache: false
      # Trusted publishing needs npm CLI 11.5.1 or later; Node 22 ships npm 10.
      # Pinned to an exact version because this job can publish.
      - run: npm install -g npm@12.2.1
      # Skip dependency install scripts in the job that can publish. The build
      # and the test-suite do not need them (checked with
      # `npm ci --ignore-scripts && npm run check`).
      - run: npm ci --ignore-scripts
      # v2 detects what was published from the Changesets output file rather
      # than from stdout, so it pushes the git tag and creates the GitHub
      # release; v1 did neither for 0.1.1. The token comes from `github-token`,
      # which defaults to the workflow's GITHUB_TOKEN.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
